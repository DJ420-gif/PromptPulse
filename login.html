<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChatBox420</title>
<meta name="description" content="ChatBox420">
<link rel="canonical" href="https://dj420-gif.github.io/Chatbox420/">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --cream:#fff7f3;
  --cream-deep:#fdeee6;
  --wine:#6e1e39;
  --plum:#2b0f1c;
  --rose:#c9527b;
  --rose-soft:#e8a2b8;
  --gold:#c79a56;
  --gold-soft:#e6cd9a;
  --line:#f1c6d2;
}

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  padding:0;
  width:100%;
  min-height:100%;
}

body{
  min-height:100vh;

  background:
    radial-gradient(
      ellipse 900px 600px at 15% 10%,
      #fbe0e9 0%,
      transparent 60%
    ),
    radial-gradient(
      ellipse 900px 700px at 90% 90%,
      #f7dcd1 0%,
      transparent 55%
    ),
    var(--cream);

  font-family:'Jost',sans-serif;
  color:var(--plum);

  display:flex;
  align-items:center;
  justify-content:center;

  padding:25px 18px;

  overflow:hidden;
}

/* ---------------- BACKGROUND PETALS ---------------- */

.petal{
  position:fixed;
  top:-40px;

  width:13px;
  height:13px;

  background:var(--rose-soft);

  border-radius:0 60% 0 60%;

  opacity:.3;

  pointer-events:none;

  animation:fall linear infinite;
}

@keyframes fall{
  0%{
    transform:translateY(0) rotate(0deg);
  }

  100%{
    transform:translateY(110vh) rotate(300deg);
  }
}

/* ---------------- LOGIN CARD ---------------- */

.card{
  position:relative;
  z-index:5;

  width:100%;
  max-width:440px;

  background:#fffcfa;

  border:1px solid var(--line);

  border-radius:7px;

  padding:52px 40px 42px;

  text-align:center;

  box-shadow:
    0 30px 70px -30px rgba(110,30,57,.25),
    inset 0 0 0 1px rgba(199,154,86,.12);

  animation:cardIn .7s ease both;
}

@keyframes cardIn{
  from{
    opacity:0;
    transform:translateY(18px);
  }

  to{
    opacity:1;
    transform:translateY(0);
  }
}

/* ---------------- ORNAMENT ---------------- */

.ornament{
  width:36px;
  height:36px;

  margin:0 auto 20px;
}

/* ---------------- TEXT ---------------- */

.kicker{
  font-family:'Cormorant Garamond',serif;

  font-style:italic;

  font-size:1.05rem;

  color:var(--rose);

  margin:0 0 6px;
}

h1{
  font-family:'Cormorant Garamond',serif;

  font-weight:600;

  font-size:clamp(2.1rem,8vw,2.8rem);

  line-height:1.08;

  color:var(--wine);

  margin:0 0 20px;
}

.rule{
  width:58px;
  height:1px;

  background:var(--gold);

  margin:0 auto 24px;
}

.description{
  font-size:.96rem;

  line-height:1.7;

  color:#4a2333;

  margin:0 0 27px;
}

/* ---------------- INPUT ---------------- */

.field{
  text-align:left;
}

label{
  display:block;

  font-family:'Cormorant Garamond',serif;

  font-style:italic;

  font-size:1rem;

  color:var(--rose);

  margin-bottom:7px;
}

#usernameInput{
  width:100%;

  border:1px solid var(--line);

  border-radius:6px;

  padding:14px;

  font-family:'Jost',sans-serif;

  font-size:.95rem;

  color:var(--plum);

  background:var(--cream);

  outline:none;

  transition:
    border-color .2s ease,
    box-shadow .2s ease;
}

#usernameInput::placeholder{
  color:#c89aaa;
}

#usernameInput:focus{
  border-color:var(--rose-soft);

  box-shadow:
    0 0 0 3px rgba(232,162,184,.14);
}

/* ---------------- ERROR ---------------- */

#error{
  min-height:22px;

  margin:7px 0 3px;

  font-size:.82rem;

  color:var(--rose);
}

/* ---------------- BUTTON ---------------- */

#loginBtn{
  width:100%;

  margin-top:13px;

  padding:14px 0;

  border:0;

  border-radius:3px;

  background:var(--wine);

  color:var(--cream);

  font-family:'Jost',sans-serif;

  font-size:.98rem;

  letter-spacing:.02em;

  cursor:pointer;

  box-shadow:
    0 10px 24px -10px rgba(110,30,57,.55);

  transition:
    transform .18s ease,
    background .18s ease,
    opacity .18s ease;
}

#loginBtn:hover{
  transform:translateY(-2px);

  background:#5a1830;
}

#loginBtn:active{
  transform:translateY(0);
}

#loginBtn:disabled{
  opacity:.6;

  cursor:wait;

  transform:none;
}

/* ---------------- FOOTER ---------------- */

footer{
  margin-top:25px;

  font-size:.76rem;

  color:var(--rose-soft);

  letter-spacing:.04em;
}

/* ---------------- WELCOME SCREEN ---------------- */

.welcome{
  position:fixed;

  inset:0;

  z-index:100;

  background:
    radial-gradient(
      circle at 50% 42%,
      #7c2745 0%,
      #5c1730 45%,
      #350c1c 100%
    );

  display:flex;

  align-items:center;
  justify-content:center;

  text-align:center;

  padding:24px;

  opacity:0;

  pointer-events:none;

  transition:opacity .5s ease;
}

.welcome.active{
  opacity:1;

  pointer-events:all;
}

.welcome-glow{
  position:absolute;

  width:65vmax;
  height:65vmax;

  border-radius:50%;

  background:
    radial-gradient(
      circle,
      rgba(231,181,143,.24),
      transparent 70%
    );

  animation:pulse 4s ease-in-out infinite;
}

@keyframes pulse{

  0%,100%{
    transform:scale(1);
  }

  50%{
    transform:scale(1.12);
  }

}

.welcome-content{
  position:relative;

  z-index:2;

  display:flex;

  flex-direction:column;

  align-items:center;
}

#welcomeTitle{
  font-family:'Cormorant Garamond',serif;

  font-style:italic;

  font-size:clamp(2.4rem,9vw,3.4rem);

  font-weight:600;

  color:var(--cream);

  margin:0 0 8px;

  opacity:0;

  transform:translateY(14px);

  transition:
    opacity .8s ease,
    transform .8s ease;
}

#welcomeTitle.show{
  opacity:1;

  transform:translateY(0);
}

#welcomeText{
  font-family:'Jost',sans-serif;

  font-size:1rem;

  color:var(--gold-soft);

  margin:0 0 25px;

  opacity:0;

  transform:translateY(14px);

  transition:
    opacity .8s ease,
    transform .8s ease;
}

#welcomeText.show{
  opacity:1;

  transform:translateY(0);
}

#welcomeName{
  font-family:'Cormorant Garamond',serif;

  font-style:italic;

  font-size:1.7rem;

  color:var(--cream);

  border:1px solid var(--gold);

  border-radius:6px;

  padding:9px 27px;

  opacity:0;

  transform:translateY(14px);

  transition:
    opacity .8s ease,
    transform .8s ease;
}

#welcomeName.show{
  opacity:1;

  transform:translateY(0);
}

/* ---------------- FALLING HEARTS ---------------- */

.heart-field{
  position:absolute;

  inset:0;

  overflow:hidden;
}

.heart{
  position:absolute;

  top:-30px;

  width:13px;
  height:13px;

  transform:rotate(-45deg);

  opacity:0;

  animation:heartFall linear forwards;
}

.heart::before,
.heart::after{
  content:"";

  position:absolute;

  width:13px;
  height:13px;

  border-radius:50%;

  background:inherit;
}

.heart::before{
  top:-6px;
  left:0;
}

.heart::after{
  top:0;
  left:6px;
}

@keyframes heartFall{

  0%{
    transform:
      translate(0,0)
      rotate(-45deg)
      scale(.6);

    opacity:0;
  }

  10%{
    opacity:1;
  }

  90%{
    opacity:.8;
  }

  100%{
    transform:
      translate(var(--drift),110vh)
      rotate(-45deg)
      scale(.8);

    opacity:0;
  }
}

/* ---------------- MOBILE ---------------- */

@media(max-width:480px){

  body{
    padding:18px 14px;
  }

  .card{
    padding:43px 24px 35px;
  }

  h1{
    font-size:2.25rem;
  }

  .description{
    font-size:.91rem;
  }
}
</style>
</head>

<body>

<!-- Background petals -->
<div id="petalField"></div>


<!-- ================= LOGIN CARD ================= -->

<main class="card">

  <svg
    class="ornament"
    viewBox="0 0 34 34"
    fill="none"
    aria-hidden="true"
  >
    <path
      d="M17 27C17 27 4 19.5 4 11.5C4 7.35 7.13 4 11 4C13.5 4 15.7 5.4 17 7.5C18.3 5.4 20.5 4 23 4C26.87 4 30 7.35 30 11.5C30 19.5 17 27 17 27Z"
      stroke="#c79a56"
      stroke-width="1.2"
    />
  </svg>

  <p class="kicker">
    ChatBox DJ420
  </p>

  <h1>
    Almost there.<br>
    Come on in.
  </h1>

  <div class="rule"></div>

  <p class="description">
    This little space is only for the people who are meant to be here.
    Enter your username below, and if it belongs here, I'll open the door.
  </p>

  <div class="field">

    <label for="usernameInput">
      Your username
    </label>

    <input
      id="usernameInput"
      type="text"
      maxlength="30"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      placeholder="enter your username..."
    >

  </div>

  <p
    id="error"
    aria-live="polite"
  ></p>

  <button id="loginBtn">
    Enter the chat
  </button>

  <footer>
    a small door to a private conversation
  </footer>

</main>


<!-- ================= SUCCESS SCREEN ================= -->

<div
  class="welcome"
  id="welcome"
>

  <div
    class="heart-field"
    id="heartField"
  ></div>

  <div class="welcome-glow"></div>

  <div class="welcome-content">

    <p id="welcomeTitle">
      Welcome.
    </p>

    <p id="welcomeText">
      The door is open.
    </p>

    <div id="welcomeName"></div>

  </div>

</div>


<script>

/* =====================================================
   SETTINGS
   ===================================================== */

/*
   These are the usernames allowed to enter.
*/
const allowedUsers = [
  "Me",
  "Queen"
];


/*
   Your ChatBox page.
*/
const CHATBOX_URL =
  "https://dj420-gif.github.io/Chatweb/Chatbox420.html";


/* =====================================================
   ELEMENTS
   ===================================================== */

const usernameInput =
  document.getElementById("usernameInput");

const loginBtn =
  document.getElementById("loginBtn");

const error =
  document.getElementById("error");

const welcome =
  document.getElementById("welcome");

const welcomeTitle =
  document.getElementById("welcomeTitle");

const welcomeText =
  document.getElementById("welcomeText");

const welcomeName =
  document.getElementById("welcomeName");

const heartField =
  document.getElementById("heartField");

const petalField =
  document.getElementById("petalField");


/* =====================================================
   CREATE BACKGROUND PETALS
   ===================================================== */

function createPetals(){

  for(let i = 0; i < 12; i++){

    const petal =
      document.createElement("div");

    petal.className = "petal";

    petal.style.left =
      Math.random() * 100 + "vw";

    petal.style.animationDuration =
      (9 + Math.random() * 8) + "s";

    petal.style.animationDelay =
      (-Math.random() * 12) + "s";

    petal.style.opacity =
      (.15 + Math.random() * .25).toFixed(2);

    petalField.appendChild(petal);
  }

}


/* =====================================================
   CREATE FALLING HEART
   ===================================================== */

function spawnHeart(){

  const heart =
    document.createElement("div");

  heart.className = "heart";

  const size =
    9 + Math.random() * 12;

  const colors = [
    "#e88fae",
    "#c79a56",
    "#fbe0e9",
    "#d46a85"
  ];

  heart.style.width =
    size + "px";

  heart.style.height =
    size + "px";

  heart.style.left =
    Math.random() * 100 + "vw";

  heart.style.background =
    colors[
      Math.floor(
        Math.random() * colors.length
      )
    ];

  heart.style.setProperty(
    "--drift",
    (Math.random() * 180 - 90) + "px"
  );

  const duration =
    4 + Math.random() * 3;

  heart.style.animationDuration =
    duration + "s";

  heartField.appendChild(heart);

  setTimeout(
    () => heart.remove(),
    duration * 1000 + 300
  );

}


/* =====================================================
   LOGIN
   ===================================================== */

function login(){

  const enteredUsername =
    usernameInput.value.trim();


  /* Empty input */

  if(!enteredUsername){

    error.textContent =
      "Please enter your username.";

    usernameInput.focus();

    return;
  }


  /*
     Case-insensitive check.

     Example:
     me     -> accepted
     ME     -> accepted
     Queen  -> accepted
     queen  -> accepted
  */

  const matchedUser =
    allowedUsers.find(
      user =>
        user.toLowerCase() ===
        enteredUsername.toLowerCase()
    );


  /* Wrong username */

  if(!matchedUser){

    error.textContent =
      "That username isn't allowed here.";

    usernameInput.focus();

    usernameInput.select();

    return;
  }


  /* ================================================
     CORRECT USER
     ================================================ */

  /*
     Store username for Chatbox420.html.
  */

  sessionStorage.setItem(
    "chatUsername",
    matchedUser
  );


  /* Disable button */

  loginBtn.disabled = true;

  loginBtn.textContent =
    "Opening…";

  error.textContent = "";


  /* Show welcome screen */

  welcomeName.textContent =
    matchedUser;

  welcome.classList.add("active");


  /* Create initial hearts */

  for(let i = 0; i < 20; i++){

    setTimeout(
      spawnHeart,
      i * 80
    );

  }


  /* Continue hearts */

  const heartTimer =
    setInterval(
      spawnHeart,
      180
    );


  /* Animate text */

  setTimeout(
    () => {
      welcomeTitle.classList.add("show");
    },
    300
  );


  setTimeout(
    () => {
      welcomeText.classList.add("show");
    },
    900
  );


  setTimeout(
    () => {
      welcomeName.classList.add("show");
    },
    1500
  );


  /*
     Redirect to ChatBox.
  */

  setTimeout(
    () => {

      clearInterval(heartTimer);

      window.location.href =
        CHATBOX_URL +
        "?user=" +
        encodeURIComponent(matchedUser);

    },
    2500
  );

}


/* =====================================================
   EVENTS
   ===================================================== */

loginBtn.addEventListener(
  "click",
  login
);


usernameInput.addEventListener(
  "keydown",
  function(event){

    if(event.key === "Enter"){

      event.preventDefault();

      login();

    }

  }
);


usernameInput.addEventListener(
  "input",
  function(){

    error.textContent = "";

  }
);


/* =====================================================
   START
   ===================================================== */

createPetals();

usernameInput.focus();

</script>

</body>
</html>
